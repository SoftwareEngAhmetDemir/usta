[project]
name = "usta-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncmy>=0.2.10",
    "alembic>=1.14",
    "python-multipart>=0.0.17",
    "cryptography>=44",  # asyncmy needs it for MySQL 8 caching_sha2_password auth
    "google-genai>=1.30",  # Gemini (app/ai/gemini.py)
    "reportlab>=4",  # QR SVG + sticker PDF
    "sqladmin>=0.20",  # /admin (KAN-41)
    "itsdangerous>=2",  # SQLAdmin's signed session
    # Knowledge pipelines (local, no LLM): transcription, embeddings, rerank, vectors, OCR, document parsing
    "faster-whisper>=1.1",
    "sentence-transformers>=3.3",
    "chromadb>=1.0",
    "numpy>=1.26",
    "pdfplumber>=0.11",  # PDF text per page, tables, headings; pypdfium2 renders scanned pages for OCR
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pytesseract>=0.3.13",  # needs the tesseract binary (brew install tesseract)
    "httpx>=0.27",  # Google's free translate / speech endpoints (app/ai/google_free.py)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "mypy>=1.13",
    "ruff>=0.8",
    "pypdf>=5",  # tests read back generated sticker PDFs
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"] # generated by `alembic revision --autogenerate`

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN", "ASYNC", "S", "SIM", "RUF"]
# RUF001-003: Turkish/Arabic text (ı, ş, ...) is normal in this app, not a typo.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"app/admin/views.py" = ["RUF012"] # SQLAdmin views are configured with class attributes
"tests/**" = ["S101", "S105", "S106"] # assert is how pytest checks; test passwords are fixtures

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]
# No type hints shipped; calls into them are wrapped (str(), bytes) where values leave the module.
module = ["reportlab.*", "wtforms.*", "faster_whisper.*", "pytesseract.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
